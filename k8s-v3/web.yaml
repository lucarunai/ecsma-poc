apiVersion: v1
kind: Service
metadata:
  name: cloud-agent-web
  namespace: cloud-agent-poc-v3
spec:
  type: LoadBalancer
  selector:
    app: cloud-agent-web
  ports:
    - port: 18083
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-agent-web
  namespace: cloud-agent-poc-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-agent-web
  template:
    metadata:
      labels:
        app: cloud-agent-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: cloud-agent-poc-v3:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cloud-agent-poc-v3-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
