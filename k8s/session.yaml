apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: session-artifacts
  namespace: cloud-agent-poc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-agent-session
  namespace: cloud-agent-poc
spec:
  selector:
    app: cloud-agent-session
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-agent-session
  namespace: cloud-agent-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-agent-session
  template:
    metadata:
      labels:
        app: cloud-agent-session
    spec:
      containers:
        - name: session
          image: cloud-agent-poc:local
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - cloud_agent_poc.session_app:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          envFrom:
            - configMapRef:
                name: cloud-agent-poc-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
