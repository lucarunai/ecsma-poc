[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloud-agent-poc"
version = "0.1.0"
description = "V0 Cloud Agent Platform coding workflow PoC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_agent_poc"]
