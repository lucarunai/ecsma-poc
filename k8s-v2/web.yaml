apiVersion: v1
kind: Service
metadata:
  name: cloud-agent-web
  namespace: cloud-agent-poc-v2
spec:
  type: LoadBalancer
  selector:
    app: cloud-agent-web
  ports:
    - port: 18082
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-agent-web
  namespace: cloud-agent-poc-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-agent-web
  template:
    metadata:
      labels:
        app: cloud-agent-web
    spec:
      containers:
        - name: web
          image: cloud-agent-poc-v2:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cloud-agent-poc-v2-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
