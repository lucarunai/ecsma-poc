apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-agent-poc-v2-config
  namespace: cloud-agent-poc-v2
data:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecsma_poc
  SESSION_LAYER_URL: http://cloud-agent-session:8000
  SANDBOX_LAYER_URL: http://cloud-agent-sandbox:8000
  GITHUB_BROKER_URL: http://cloud-agent-github-broker:8000
  SANDBOX_EXECUTION_MODE: kubernetes
  SANDBOX_RUNTIME_IMAGE: cloud-agent-poc-v2:local
  SANDBOX_TOOL_TIMEOUT_SECONDS: "180"
  SANDBOX_WORKSPACE_CLAIM: sandbox-workspaces
  GITHUB_REPO_URL: https://github.com/lucarunai/demo.git
  GITHUB_SOURCE_BRANCH: test
  GITHUB_TARGET_BRANCH: main
  WORKSPACE_ROOT: /sandboxes
  CLAUDE_CONFIG_DIR: /home/cloudagent/.claude
  GIT_AUTHOR_NAME: Cloud Agent PoC
  GIT_AUTHOR_EMAIL: cloud-agent-poc-v2@example.local
