apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloud-agent-poc-v2
spec:
  selector:
    app: cloud-agent-poc-v2-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cloud-agent-poc-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-agent-poc-v2-postgres
  template:
    metadata:
      labels:
        app: cloud-agent-poc-v2-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: ecsma_poc
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "ecsma_poc"]
            periodSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
