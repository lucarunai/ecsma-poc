<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#173b7a"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#047857"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .title { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 850; fill: #0b1b3a; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #183153; }
      .panel { fill: rgba(255,255,255,0.84); stroke: #9bb9dd; stroke-width: 1.3; rx: 16; filter: url(#shadow); }
      .panelTitle { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 850; fill: #071a3a; }
      .box { fill: #f8fbff; stroke: #1d4ed8; stroke-width: 1.4; rx: 11; filter: url(#shadow); }
      .green { fill: #ecfdf5; stroke: #059669; }
      .orange { fill: #fff7ed; stroke: #f59e0b; }
      .purple { fill: #f5f3ff; stroke: #7c3aed; }
      .red { fill: #fff1f2; stroke: #ef4444; }
      .dash { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.3; stroke-dasharray: 7 5; rx: 11; }
      .boxTitle { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 850; fill: #0b1b3a; text-anchor: middle; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 11px; fill: #0b1b3a; text-anchor: middle; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; fill: #0f172a; }
      .arrow { stroke: #173b7a; stroke-width: 2.2; fill: none; marker-end: url(#blueArrow); }
      .state { stroke: #047857; stroke-width: 2.2; fill: none; marker-end: url(#greenArrow); }
      .secret { stroke: #dc2626; stroke-width: 2.1; fill: none; marker-end: url(#redArrow); }
      .dashLine { stroke: #173b7a; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; marker-end: url(#blueArrow); }
      .label { font-family: Inter, Arial, sans-serif; font-size: 10.5px; fill: #075985; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="960"/>
  <text class="title" x="26" y="42">Tool and Pod Execution Flow - Trusted vs Secretless Runtime</text>
  <text class="subtitle" x="26" y="68">Agent uses one MCP surface. Brain records tool intent before execution, routes trusted GitHub tools to the Broker, and routes workspace tools to one-shot sandbox pods.</text>

  <rect class="panel" x="35" y="110" width="360" height="700"/>
  <text class="panelTitle" x="60" y="142">1. Agent Tool Surface</text>

  <rect class="panel" x="435" y="110" width="310" height="700"/>
  <text class="panelTitle" x="460" y="142">2. Durable Tool Audit</text>

  <rect class="panel" x="785" y="110" width="355" height="700"/>
  <text class="panelTitle" x="810" y="142">3A. Trusted GitHub Runtime</text>

  <rect class="panel" x="1180" y="110" width="380" height="700"/>
  <text class="panelTitle" x="1205" y="142">3B. Secretless Sandbox Runtime</text>

  <rect class="box green" x="75" y="190" width="140" height="80"/>
  <text class="boxTitle" x="145" y="218">Task Agent</text>
  <text class="small" x="145" y="240">fresh query</text>
  <text class="small" x="145" y="258">MCP enabled</text>

  <rect class="box green" x="75" y="340" width="270" height="120"/>
  <text class="boxTitle" x="210" y="368">SDK MCP Tool Surface</text>
  <text class="small" x="210" y="392">clone_github_repository</text>
  <text class="small" x="210" y="412">read/write/edit/search</text>
  <text class="small" x="210" y="432">git status / branch / commit</text>
  <text class="small" x="210" y="452">unittest / PR tools</text>

  <rect class="box green" x="105" y="550" width="210" height="92"/>
  <text class="boxTitle" x="210" y="578">Tool Router</text>
  <text class="small" x="210" y="602">TRUSTED_GITHUB_TOOLS</text>
  <text class="small" x="210" y="622">everything else - sandbox</text>

  <path class="arrow" d="M145 270 L190 340"/>
  <path class="arrow" d="M210 460 L210 550"/>

  <!-- Audit -->
  <rect class="box" x="475" y="185" width="230" height="102"/>
  <text class="boxTitle" x="590" y="213">tool_calls</text>
  <text class="small" x="590" y="236">created before execution</text>
  <text class="mono" x="505" y="260">status = requested</text>
  <text class="mono" x="505" y="278">input JSONB</text>

  <rect class="box" x="475" y="380" width="230" height="120"/>
  <text class="boxTitle" x="590" y="408">tool_executions</text>
  <text class="small" x="590" y="431">one row per runtime envelope</text>
  <text class="mono" x="505" y="455">execution_status</text>
  <text class="mono" x="505" y="473">failure_kind</text>
  <text class="mono" x="505" y="491">envelope JSONB</text>

  <rect class="box red" x="475" y="590" width="230" height="110"/>
  <text class="boxTitle" x="590" y="618">Failure Resume Data</text>
  <text class="small" x="590" y="642">tool_calls.status=failed</text>
  <text class="small" x="590" y="660">failure_kind</text>
  <text class="small" x="590" y="678">latest_execution_id</text>

  <path class="state" d="M315 596 L475 236"/>
  <text class="label" x="392" y="397">persist intent</text>
  <path class="state" d="M705 440 L785 440"/>
  <text class="label" x="742" y="423">record envelope</text>
  <path class="state" d="M590 500 L590 590"/>

  <!-- Trusted -->
  <rect class="box orange" x="830" y="190" width="125" height="80"/>
  <text class="boxTitle" x="892.5" y="218">GitHub Broker</text>
  <text class="small" x="892.5" y="240">trusted pod</text>
  <text class="small" x="892.5" y="258">has token</text>

  <rect class="box orange" x="992" y="190" width="105" height="80"/>
  <text class="boxTitle" x="1044.5" y="218">GitHub</text>
  <text class="small" x="1044.5" y="240">repo</text>
  <text class="small" x="1044.5" y="258">PR target</text>

  <rect class="box orange" x="830" y="345" width="267" height="105"/>
  <text class="boxTitle" x="963.5" y="373">Trusted Tool Set</text>
  <text class="small" x="963.5" y="397">clone / checkout</text>
  <text class="small" x="963.5" y="417">push current branch</text>
  <text class="small" x="963.5" y="437">create pull request</text>

  <rect class="box orange" x="870" y="545" width="190" height="80"/>
  <text class="boxTitle" x="965" y="573">Workspace Mount</text>
  <text class="small" x="965" y="596">/sandboxes/{run_id}</text>
  <text class="small" x="965" y="614">shared PVC</text>

  <rect class="box" x="870" y="675" width="190" height="72"/>
  <text class="boxTitle" x="965" y="703">Tool Envelope</text>
  <text class="small" x="965" y="726">trusted_github_executor</text>

  <path class="arrow" d="M315 590 C520 460 660 230 830 230"/>
  <text class="label" x="605" y="304">trusted GitHub tool</text>
  <path class="arrow" d="M955 230 L992 230"/>
  <path class="arrow" d="M892 270 L930 345"/>
  <path class="arrow" d="M965 450 L965 545"/>
  <path class="arrow" d="M965 625 L965 675"/>
  <path class="state" d="M870 712 C760 690 700 560 705 440"/>

  <!-- Sandbox -->
  <rect class="box purple" x="1225" y="180" width="135" height="90"/>
  <text class="boxTitle" x="1292.5" y="208">Sandbox API</text>
  <text class="small" x="1292.5" y="230">workspace check</text>
  <text class="small" x="1292.5" y="248">pod launch</text>

  <rect class="box purple" x="1400" y="180" width="120" height="90"/>
  <text class="boxTitle" x="1460" y="208">K8s API</text>
  <text class="small" x="1460" y="230">create/get/log</text>
  <text class="small" x="1460" y="248">delete pod</text>

  <rect class="box purple" x="1225" y="335" width="135" height="95"/>
  <text class="boxTitle" x="1292.5" y="363">One-Shot Pod</text>
  <text class="small" x="1292.5" y="386">restartPolicy Never</text>
  <text class="small" x="1292.5" y="406">activeDeadlineSeconds</text>

  <rect class="box purple" x="1400" y="335" width="120" height="95"/>
  <text class="boxTitle" x="1460" y="363">Runtime Env</text>
  <text class="small" x="1460" y="386">REQUEST_B64</text>
  <text class="small" x="1460" y="406">WORKSPACE_PATH</text>

  <rect class="box purple" x="1225" y="495" width="135" height="95"/>
  <text class="boxTitle" x="1292.5" y="523">Workspace Tools</text>
  <text class="small" x="1292.5" y="546">read/write/edit</text>
  <text class="small" x="1292.5" y="566">glob/grep</text>

  <rect class="box purple" x="1400" y="495" width="120" height="95"/>
  <text class="boxTitle" x="1460" y="523">Local Tools</text>
  <text class="small" x="1460" y="546">git status</text>
  <text class="small" x="1460" y="566">unittest</text>

  <rect class="box purple" x="1310" y="675" width="150" height="72"/>
  <text class="boxTitle" x="1385" y="703">Runtime Envelope</text>
  <text class="small" x="1385" y="726">pod phase / exit code</text>

  <path class="arrow" d="M315 602 C520 735 920 225 1225 225"/>
  <text class="label" x="705" y="760">secretless workspace tool</text>
  <path class="arrow" d="M1360 225 L1400 225"/>
  <path class="arrow" d="M1292 270 L1292 335"/>
  <path class="arrow" d="M1400 382 L1360 382"/>
  <path class="arrow" d="M1292 430 L1292 495"/>
  <path class="arrow" d="M1460 430 L1460 495"/>
  <path class="arrow" d="M1292 590 L1360 675"/>
  <path class="arrow" d="M1460 590 L1410 675"/>
  <path class="state" d="M1310 712 C1130 800 845 580 705 440"/>

  <!-- Security / crash notes -->
  <rect class="box red" x="1225" y="805" width="135" height="78"/>
  <text class="boxTitle" x="1292.5" y="831">No Secrets</text>
  <text class="small" x="1292.5" y="854">no token</text>
  <text class="small" x="1292.5" y="872">no SA token</text>

  <rect class="box red" x="1400" y="805" width="120" height="78"/>
  <text class="boxTitle" x="1460" y="831">Crash Safe</text>
  <text class="small" x="1460" y="854">failed envelope</text>
  <text class="small" x="1460" y="872">resume hint</text>

  <path class="secret" d="M1292 805 L1292 430"/>
  <path class="state" d="M1460 805 C1280 785 955 730 705 645"/>

  <rect class="dash" x="475" y="800" width="585" height="82"/>
  <text class="boxTitle" x="767.5" y="828">Resume Rule</text>
  <text class="small" x="767.5" y="852">A failed pod does not require model-session resume.</text>
  <text class="small" x="767.5" y="870">Next fresh query receives failed tool summary and must inspect workspace state.</text>
</svg>
